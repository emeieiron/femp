[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/emeieiron/femp"

[workspace.dependencies]
femp-core = { path = "crates/femp-core" }
femp-toolchain = { path = "crates/femp-toolchain" }
femp-evm = { path = "crates/femp-evm" }
femp-native = { path = "crates/femp-native" }
femp-wasm = { path = "crates/femp-wasm" }
femp-testing = { path = "crates/femp-testing" }
femp-prop = { path = "crates/femp-prop" }
femp-spec = { path = "crates/femp-spec" }
femp-harness = { path = "crates/femp-harness" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
revm = { version = "33.1.0", default-features = false, features = ["std"] }
ruint = "1.17"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
toml = "0.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
