[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/emeieiron/femp"

[workspace.dependencies]
femp-core = { path = "crates/femp-core" }
femp-host = { path = "crates/femp-host" }
femp-evm = { path = "crates/femp-evm" }
femp-native = { path = "crates/femp-native" }
femp-wasm = { path = "crates/femp-wasm" }
femp-testing = { path = "crates/femp-testing" }
femp-prop = { path = "crates/femp-prop" }
femp-spec = { path = "crates/femp-spec" }
femp-vir = { path = "crates/femp-vir" }
femp-compiler = { path = "crates/femp-compiler" }
femp-prove = { path = "crates/femp-prove" }
femp-harness = { path = "crates/femp-harness" }

# The Fe compiler, linked only into femp-compiler under its own crate names.
# Keep the tag in step with femp_compiler::LINKED_FE_VERSION.
# Fe's IR ids implement this crate's `EntityRef`.
cranelift-entity = "0.136"
codegen = { package = "fe-codegen", git = "https://github.com/argotorg/fe", tag = "v26.7.0", features = ["cranelift", "wasm"] }
common = { package = "fe-common", git = "https://github.com/argotorg/fe", tag = "v26.7.0" }
contract-harness = { package = "fe-contract-harness", git = "https://github.com/argotorg/fe", tag = "v26.7.0" }
driver = { package = "fe-driver", git = "https://github.com/argotorg/fe", tag = "v26.7.0" }
hir = { package = "fe-hir", git = "https://github.com/argotorg/fe", tag = "v26.7.0" }
mir = { package = "fe-mir", git = "https://github.com/argotorg/fe", tag = "v26.7.0" }

anyhow = "1"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
revm = { version = "33.1.0", default-features = false, features = ["std"] }
num-bigint = "0.4"
ruint = "1.17"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tiny-keccak = { version = "2", features = ["keccak"] }
toml = "0.8"
url = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
